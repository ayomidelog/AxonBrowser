name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-bundle:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl ca-certificates build-essential pkg-config

      - name: Install Rust
        run: |
          set -euo pipefail
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo fmt --check

      - name: Clippy
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo test

      - name: Build release binaries
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --bins

      - name: Assemble bundle
        run: |
          set -euo pipefail
          mkdir -p dist/bin dist/scripts
          cp target/release/axonbrowser dist/bin/
          cp target/release/axonbrowse dist/bin/
          cp README.md dist/
          cp scripts/install-axonbrowser.sh dist/scripts/
          cp scripts/install-runtime-deps.sh dist/scripts/
          cp scripts/install-chrome-local.sh dist/scripts/
          cp scripts/install-firefox-local.sh dist/scripts/
          cp scripts/install-edge-local.sh dist/scripts/
          cp scripts/install-camoufox.sh dist/scripts/
          tar -czf axonbrowser-linux-x86_64.tar.gz -C dist .
          sha256sum axonbrowser-linux-x86_64.tar.gz > axonbrowser-linux-x86_64.tar.gz.sha256

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonbrowser-linux-x86_64
          path: |
            axonbrowser-linux-x86_64.tar.gz
            axonbrowser-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            axonbrowser-linux-x86_64.tar.gz
            axonbrowser-linux-x86_64.tar.gz.sha256
