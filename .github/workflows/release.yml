name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  linux-bundle:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y curl ca-certificates build-essential pkg-config

      - name: Install Rust
        run: |
          set -euo pipefail
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup component add clippy rustfmt
          rustc --version
          cargo --version

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo fmt --check

      - name: Clippy
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo test

      - name: Build release binaries
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          cargo build --release --bins

      - name: Assemble release assets
        run: |
          set -euo pipefail
          . "$HOME/.cargo/env"
          bash scripts/build-release-bundle.sh

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: axonbrowser-linux-x86_64
          path: |
            dist/release/axonbrowser-linux-x86_64.tar.gz
            dist/release/axonbrowser-linux-x86_64.tar.gz.sha256
            dist/release/install.sh

      - name: Publish first release assets
        if: github.ref_type == 'tag' && github.ref_name == 'v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          name: AxonBrowser v1.0.0
          body_path: .github/release-body-v1.0.0.md
          files: |
            dist/release/axonbrowser-linux-x86_64.tar.gz
            dist/release/axonbrowser-linux-x86_64.tar.gz.sha256
            dist/release/install.sh

      - name: Publish GitHub release assets
        if: github.ref_type == 'tag' && github.ref_name != 'v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/release/axonbrowser-linux-x86_64.tar.gz
            dist/release/axonbrowser-linux-x86_64.tar.gz.sha256
            dist/release/install.sh
