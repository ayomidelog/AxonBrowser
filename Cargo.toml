[package]
name = "axonbrowser"
version = "0.1.0"
edition = "2024"
default-run = "axonbrowser"

[dependencies]
anyhow = "1"
async-recursion = "1"
atspi = { version = "0.29.0", features = ["tokio"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
